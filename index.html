<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTypist - Medical Typing Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>MedTypist</h1>
    <p class="description">Practice your typing with real clinical phrases and medical documentation terms.</p>

    <div id="phrase-box">Loading phrase...</div>
    <textarea id="typing-area" placeholder="Start typing here..." rows="4"></textarea>

    <div class="stats">
      <span id="wpm">WPM: 0</span>
      <span id="accuracy">Accuracy: 0%</span>
      <button id="restart">New Phrase</button>
    </div>

    <footer>
      <p>&copy; 2024 MedTypist by [Your Name]. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
